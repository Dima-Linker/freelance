<header class="header">
  <div class="header__left">
    <div class="header__search">
      <span class="header__search-icon" aria-hidden="true">
        ⌕
      </span>

      <input
        type="search"
        placeholder="Search opportunities, clients, or contracts..."
        aria-label="Search opportunities, clients, or contracts"
      />

      <span class="header__search-shortcut">
        ⌘ K
      </span>
    </div>
  </div>

  <div class="header__right">
    <div class="header__balance">
      <span class="header__balance-dot"></span>

      <span class="header__balance-label">
        Escrow balance:
      </span>

      <span class="header__balance-value">
        €8,140.00
      </span>
    </div>

    <button
      type="button"
      class="header__icon-button"
      aria-label="Notifications"
    >
      <span aria-hidden="true">♧</span>
    </button>

    <button
      type="button"
      class="header__icon-button"
      aria-label="Help"
    >
      ?
    </button>

    <a
      routerLink="/jobs"
      class="header__jobs-button"
    >
      <span aria-hidden="true">↗</span>
      <span>Find Jobs</span>
    </a>
  </div>
</header>
