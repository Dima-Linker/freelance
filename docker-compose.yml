services:
  postgres:
    image: postgres:17
    container_name: nx-mono-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: freelancer_dev
      POSTGRES_USER: freelancer
      POSTGRES_PASSWORD: freelancer_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U freelancer -d freelancer_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
